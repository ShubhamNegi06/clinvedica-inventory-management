[project]
name = "specimen-inventory-backend"
version = "2.0.0"
description = "Clinvedica Specimen Inventory Management Platform — Production Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.5.2",
    "pyjwt[crypto]>=2.9.0",
    "boto3>=1.35.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "psycopg2>=2.9.12",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.2",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
